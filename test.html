<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖誕祈福願望板 Christmas Wishboard</title>
    <!-- 引入外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部頁首與標題區 -->
    <header class="site-header">
        <h1>🎄 聖誕願望祈福牆 🎄</h1>
        <p>在這裡點亮點點星光，留下你最真摯的祝福與聖誕願望。</p>
        <div class="action-buttons">
            <button id="open-modal-btn" class="btn primary-btn">✨ 寫下願望</button>
            <button id="toggle-admin-btn" class="btn admin-toggle-btn">🔒 管理員模式</button>
        </div>
    </header>

    <!-- 管理者控制面板（預設隱藏，僅顯示骨架） -->
    <section id="admin-panel" class="admin-panel hidden">
        <h2>🛡️ 後台管理篩選面板</h2>
        <div class="filter-controls">
            <button class="filter-btn active">全部留言</button>
            <button class="filter-btn">待審核</button>
            <button class="filter-btn">已發布</button>
        </div>
    </section>

    <!-- 主要願望牆區塊（白板區） -->
    <main class="board-container">
        <!-- 假資料範例：示範未來留言卡片在 HTML 中的樣子 -->
        <div class="wish-card gold">
            <div class="card-header">
                <span class="author">小麥</span>
                <span class="badge approved">已核准</span>
            </div>
            <p class="content">希望期末專題順利通過！祝大家聖誕快樂、心想事成！</p>
            <div class="card-footer">
                <span class="date">2026-12-24</span>
                <button class="delete-btn admin-only hidden">🗑️ 刪除</button>
            </div>
        </div>

        <div class="wish-card red">
            <div class="card-header">
                <span class="author">神秘聖誕老人</span>
                <span class="badge pending">待審核</span>
            </div>
            <p class="content">願天下的大家都能在這個冬夜裡感受到溫暖。 Merry Christmas!</p>
            <div class="card-footer">
                <span class="date">2026-12-25</span>
                <button class="delete-btn admin-only hidden">🗑️ 刪除</button>
            </div>
        </div>
    </main>

    <!-- 發布願望的彈窗 (Modal) -->
    <div id="wish-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h2>🎁 寫下你的聖誕祝福</h2>
            <form id="wish-form">
                <div class="form-group">
                    <label for="user-name">你的暱稱或名字：</label>
                    <input type="text" id="user-name" placeholder="例如：聖誕小精靈" required>
                </div>
                <div class="form-group">
                    <label for="wish-text">祝福或願望：</label>
                    <textarea id="wish-text" rows="4" placeholder="請輸入你想說的話..." required></textarea>
                </div>
                <button type="button" class="btn primary-btn submit-btn">送出願望</button>
            </form>
        </div>
    </div>

    <!-- 引入外部 JavaScript 檔案 -->
    <script src="script.js"></script>
</body>
</html>
