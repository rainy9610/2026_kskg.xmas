<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖誕祈福願望板 | Christmas Wishboard</title>
    <!-- Google Fonts 引入溫暖優雅的字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. 全域變數與基本樣式設定 (Global Styles & Variables)
           ========================================================================== */
        :root {
            --bg-night-top: #0a192f;
            --bg-night-bottom: #1e3a8a;
            --accent-gold: #f59e0b;
            --accent-gold-light: #fef3c7;
            --accent-red: #dc2626;
            --accent-green: #15803d;
            --text-light: #f8fafc;
            --text-dark: #1e293b;
            --card-bg-warm: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(180deg, var(--bg-night-top) 0%, var(--bg-night-bottom) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景夢幻星空微光效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 150px, #fef3c7, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 300px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 250px, #fde68a, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.5;
            pointer-events: none;
        }

        /* ==========================================================================
           2. 頂部頁首區塊 (Header Section)
